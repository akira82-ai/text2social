<!DOCTYPE html>
<html>
<head>
    <title>创建图标</title>
</head>
<body>
    <canvas id="canvas16" width="16" height="16"></canvas>
    <canvas id="canvas32" width="32" height="32"></canvas>
    <canvas id="canvas48" width="48" height="48"></canvas>
    <canvas id="canvas128" width="128" height="128"></canvas>

    <script>
        function createSimpleIcon(size, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');

            // 清空画布
            ctx.clearRect(0, 0, size, size);

            // 绘制背景
            ctx.fillStyle = '#667eea';
            ctx.fillRect(0, 0, size, size);

            // 绘制相机符号（简化的方形表示）
            ctx.fillStyle = 'white';
            const cameraSize = size * 0.6;
            const cameraX = (size - cameraSize) / 2;
            const cameraY = (size - cameraSize) / 2;
            ctx.fillRect(cameraX, cameraY + cameraSize * 0.2, cameraSize, cameraSize * 0.4);

            // 镜头圆圈
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, cameraSize * 0.15, 0, Math.PI * 2);
            ctx.fill();

            // 镜头中心
            ctx.fillStyle = '#667eea';
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, cameraSize * 0.08, 0, Math.PI * 2);
            ctx.fill();
        }

        // 生成图标并自动下载
        [16, 32, 48, 128].forEach(size => {
            createSimpleIcon(size, 'canvas' + size);
        });

        // 自动下载所有图标
        setTimeout(() => {
            [16, 32, 48, 128].forEach((size, index) => {
                setTimeout(() => {
                    const canvas = document.getElementById('canvas' + size);
                    const link = document.createElement('a');
                    link.download = 'icon' + size + '.png';
                    link.href = canvas.toDataURL();
                    link.click();
                }, index * 500);
            });
        }, 100);
    </script>
</body>
</html>
