<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template 2 - Social Share Image</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="social-card" style="width: 1080px; height: 1080px; background: white; margin: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 60px; box-sizing: border-box;">
        <div class="logo" style="position: absolute; top: 60px; right: 60px; width: 80px; height: 80px; background: #f0f0f0; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 40px;">📸</div>
        
        <div class="content-area" style="text-align: center; margin-bottom: 80px;">
            <div class="quote-text" style="font-size: 48px; color: #333; line-height: 70px; margin-bottom: 40px; font-weight: 400; max-width: 800px;">
                {{text}}
            </div>
            
            <div class="divider" style="height: 1px; width: 80%; background: linear-gradient(to right, transparent, #ddd, transparent); margin: 30px 0;"></div>
            
            <div class="source" style="font-size: 32px; color: #666; margin-top: 30px; font-style: italic; text-align: center;">
                —— {{title}}
            </div>
        </div>
        
        <div class="qr-section" style="position: absolute; bottom: 60px; right: 60px; display: flex; flex-direction: column; align-items: center; gap: 15px;">
            <div class="qr-placeholder" style="width: 120px; height: 120px; background: #f0f0f0; display: flex; justify-content: center; align-items: center; border: 5px solid white; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);">QR</div>
            <div class="qr-label" style="font-size: 24px; color: #888;">扫码查看原文</div>
        </div>
    </div>
</body>
</html>
