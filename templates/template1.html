<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模板1 - 简约风格</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template1.css">
</head>
<body>
  <div class="template-container">
    <div class="header">
      <img class="favicon" src="{{favicon}}" alt="网站图标" onerror="this.style.display='none'">
      <div class="title">{{title}}</div>
    </div>

    <div class="content">
      <div class="text-content">{{text}}</div>
    </div>

    <div class="footer">
      <div class="qr-code">
        <!-- 二维码将在这里动态生成 -->
        <div class="qr-placeholder">QR</div>
      </div>
      <div class="url">{{url}}</div>
    </div>
  </div>

  <script src="../../assets/libs/qrcode.min.js"></script>
  <script>
    // 生成二维码
    function generateQRCode(text) {
      const qrContainer = document.querySelector('.qr-placeholder');
      new QRCode(qrContainer, {
        text: text,
        width: 80,
        height: 80,
        colorDark: '#000000',
        colorLight: '#ffffff'
      });
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      const url = document.querySelector('.url').textContent;
      generateQRCode(url);
    });
  </script>
</body>
</html>
