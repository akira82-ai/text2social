<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签分类</title>
    <style>
        :root {
            --color-primary: #333;
            --color-secondary: #666;
            --color-background: #f4f4f9;
            --color-card-bg: #ffffff;
            --shadow-light: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 8px 20px rgba(0, 0, 0, 0.15);
            --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            font-family: var(--font-family-base);
            background-color: var(--color-background);
            color: var(--color-primary);
            line-height: 1.8;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .card-container {
            width: 100%;
            max-width: 600px;
            padding: 30px;
            background-color: var(--color-card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-medium);
            box-sizing: border-box;
        }

        /* ====================================================================
         * 卡片设计 9: 标签分类 (Tag Categorization)
         * 特点: 顶部彩色标签，信息分类明确
         * ====================================================================
         */
        .card-tag {
            padding: 0;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: var(--shadow-medium);
        }

        .card-tag .tag-header {
            background-color: #e74c3c; /* 红色标签背景 */
            color: white;
            padding: 15px 30px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-tag .content-body {
            padding: 30px;
            background-color: white;
        }

        .card-tag .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .card-tag .card-content {
            font-size: 16px;
            color: #7f8c8d;
            line-height: 1.7;
        }

    </style>
</head>
<body>

    <!-- 卡片 9: 标签分类 -->
    <div class="card-container card-tag">
        <div class="tag-header">
         	{{title}}
        </div>
        <div class="content-body">
            <div class="card-title">
                ///
            </div>
            <div class="card-content">
                {{text}}
            </div>
        </div>
    </div>

</body>
</html>
