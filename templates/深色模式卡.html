<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深色模式卡</title>
    <style>
        :root {
            --color-primary: #333;
            --color-secondary: #666;
            --color-background: #f4f4f9;
            --color-card-bg: #ffffff;
            --shadow-light: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 8px 20px rgba(0, 0, 0, 0.15);
            --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            font-family: var(--font-family-base);
            background-color: var(--color-background);
            color: var(--color-primary);
            line-height: 1.8;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .card-container {
            width: 100%;
            max-width: 600px;
            padding: 30px;
            background-color: var(--color-card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-medium);
            box-sizing: border-box;
        }

        /* ====================================================================
         * 卡片设计 5: 深色模式卡 (Dark Mode Card)
         * 特点: 深色背景，高对比度，现代感
         * ====================================================================
         */
        .card-dark {
            background-color: #1e272e;
            color: #ecf0f1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card-dark .card-title {
            font-size: 24px;
            font-weight: 700;
            color: #4a90e2; /* 蓝色高亮标题 */
            margin-bottom: 15px;
            border-bottom: 1px solid #34495e;
            padding-bottom: 10px;
        }

        .card-dark .card-content {
            font-size: 16px;
            line-height: 1.7;
            color: #bdc3c7;
        }

    </style>
</head>
<body>

    <!-- 卡片 5: 深色模式卡 -->
    <div class="card-container card-dark">
        <div class="card-title">
            {{title}}
        </div>
        <div class="card-content">
            {{text}}
        </div>
    </div>

</body>
</html>
