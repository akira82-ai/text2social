<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优雅标题卡</title>
    <style>
        :root {
            --color-primary: #333;
            --color-secondary: #666;
            --color-background: #f4f4f9;
            --color-card-bg: #ffffff;
            --shadow-light: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 8px 20px rgba(0, 0, 0, 0.15);
            --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            font-family: var(--font-family-base);
            background-color: var(--color-background);
            color: var(--color-primary);
            line-height: 1.8;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .card-container {
            width: 100%;
            max-width: 600px;
            padding: 30px;
            background-color: var(--color-card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-medium);
            box-sizing: border-box;
        }

        /* ====================================================================
         * 卡片设计 3: 优雅标题卡 (Elegant Title Card)
         * 特点: 居中、强调标题、柔和背景
         * ====================================================================
         */
        .card-elegant {
            text-align: center;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0e8f0 100%); /* 柔和渐变背景 */
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .card-elegant .title {
            font-size: 28px;
            font-weight: 700;
            color: #1e3a8a; /* 深蓝色标题 */
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .card-elegant .subtitle {
            font-size: 16px;
            color: #4b5563;
            margin-bottom: 25px;
            font-style: italic;
        }

        .card-elegant .text-body {
            font-size: 18px;
            color: #374151;
            font-weight: 500;
            padding: 0 10px;
        }

        .card-elegant .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #9ca3af;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

    </style>
</head>
<body>

    <!-- 卡片 3: 优雅标题卡 -->
    <div class="card-container card-elegant">
        <div class="title">
            {{title}}
        </div>
        <div class="subtitle">
            Three Truths of Life
        </div>
        <div class="text-body">
            <p>
               {{text}}
            </p>
        </div>
        <div class="footer">
            Manus Design
        </div>
    </div>

</body>
</html>
