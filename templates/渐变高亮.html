<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渐变高亮</title>
    <style>
        :root {
            --color-primary: #333;
            --color-secondary: #666;
            --color-background: #f4f4f9;
            --color-card-bg: #ffffff;
            --shadow-light: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 8px 20px rgba(0, 0, 0, 0.15);
            --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            font-family: var(--font-family-base);
            background-color: var(--color-background);
            color: var(--color-primary);
            line-height: 1.8;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .card-container {
            width: 100%;
            max-width: 600px;
            padding: 30px;
            background-color: var(--color-card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-medium);
            box-sizing: border-box;
        }

        /* ====================================================================
         * 卡片设计 6: 渐变高亮 (Gradient Highlight)
         * 特点: 标题下划线渐变，柔和圆角
         * ====================================================================
         */
        .card-gradient {
            border-radius: 25px;
            border: 1px solid #f0f0f0;
            box-shadow: var(--shadow-light);
        }

        .card-gradient .card-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 20px;
            display: inline-block;
            position: relative;
        }

        .card-gradient .card-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            border-radius: 2px;
        }

        .card-gradient .card-content {
            font-size: 17px;
            line-height: 1.8;
            color: var(--color-secondary);
        }

    </style>
</head>
<body>

    <!-- 卡片 6: 渐变高亮 -->
    <div class="card-container card-gradient">
        <div class="card-title">
            {{title}}
        </div>
        <div class="card-content">
            {{text}}
        </div>
    </div>

</body>
</html>
