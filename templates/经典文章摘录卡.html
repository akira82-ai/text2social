<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典文章摘录卡</title>
    <style>
        :root {
            --color-primary: #333;
            --color-secondary: #666;
            --color-background: #f4f4f9;
            --color-card-bg: #ffffff;
            --shadow-light: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 8px 20px rgba(0, 0, 0, 0.15);
            --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            font-family: var(--font-family-base);
            background-color: var(--color-background);
            color: var(--color-primary);
            line-height: 1.8;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .card-container {
            width: 100%;
            max-width: 600px;
            padding: 30px;
            background-color: var(--color-card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-medium);
            box-sizing: border-box;
        }

        /* ====================================================================
         * 卡片设计 1: 经典文章摘录卡 (Inspired by the first image)
         * 特点: 极简、高对比度、强调引用、侧边装饰线
         * ====================================================================
         */
        .card-quote {
            border-left: 6px solid #4a90e2; /* 蓝色强调线 */
            padding-left: 30px;
            font-size: 18px;
            font-weight: 400;
            color: #2c3e50;
        }

        .card-quote p {
            margin: 0 0 1.5em 0;
            text-indent: 2em; /* 段落首行缩进 */
        }

        .card-quote .source {
            display: block;
            margin-top: 20px;
            font-size: 14px;
            color: #95a5a6;
            text-align: right;
            border-top: 1px solid #ecf0f1;
            padding-top: 10px;
        }

    </style>
</head>
<body>

    <!-- 卡片 1: 经典文章摘录卡 -->
    <div class="card-container card-quote">
        <p>
            {{text}}
        </p>
        <span class="source">-- {{title}}</span>
    </div>

</body>
</html>
