<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签分类</title>
    <style>
        :root {
            --color-primary: #333;
            --color-secondary: #666;
            --color-background: #f4f4f9;
            --color-card-bg: #ffffff;
            --shadow-light: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 8px 20px rgba(0, 0, 0, 0.15);
            --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            font-family: var(--font-family-base);
            background-color: var(--color-background);
            color: var(--color-primary);
            line-height: 1.8;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .card-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--color-card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-medium);
            padding: 0; /* 移除容器的内边距，让卡片内容完全控制布局 */
            box-sizing: border-box;
        }

        /* ====================================================================
         * 卡片设计 9: 标签分类 (Tag Categorization)
         * 特点: 顶部彩色标签，信息分类明确
         * ====================================================================
         */
        .card-tag {
            padding: 0;
            overflow: hidden;
            border-radius: 16px; /* 统一使用 card-container 的圆角 */
            box-shadow: var(--shadow-medium);
        }

        .card-tag .tag-header {
            background-color: #e74c3c; /* 红色标签背景 */
            color: white;
            padding: 15px 30px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            /* 确保顶部圆角 */
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }

        .card-tag .content-body {
            padding: 30px;
            padding-bottom: 10px; /* 减少底部内边距，让页脚更贴近 */
            background-color: white;
        }

        .card-tag .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .card-tag .card-content {
            font-size: 16px;
            color: #7f8c8d;
            line-height: 1.7;
            margin-bottom: 20px; /* 增加底部间距 */
        }

        /* 新增底部样式 */
        .card-tag .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #f8f8f8; /* 浅灰色背景，与白色内容区区分 */
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #95a5a6; /* 较浅的文字颜色 */
            /* 确保底部圆角 */
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
        }

        .card-tag .footer-url {
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .card-tag .footer-qr-code {
            width: 50px; /* 二维码尺寸 */
            height: 50px;
            background-color: #ecf0f1; /* 占位符颜色 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            border-radius: 4px;
        }

        .card-tag .footer-qr-code img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

    </style>
</head>
<body>

    <!-- 卡片 9: 标签分类 -->
    <div class="card-container card-tag">
        <div class="tag-header">
         	{{title}}
        </div>
        <div class="content-body">
            <div class="card-title">
                ///
            </div>
            <div class="card-content">
                {{text}}
            </div>
        </div>
        <!-- 新增底部区域 -->
        <div class="card-footer">
            <div class="footer-url">
                {{url}}
            </div>
            <div class="footer-qr-code">
                <!-- 假设二维码图片路径为 {{qr_code_path}} -->
                <img src="123" alt="QR Code">
            </div>
        </div>
    </div>

</body>
</html>
