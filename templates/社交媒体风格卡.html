<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交媒体风格卡</title>
    <style>
        :root {
            --color-primary: #333;
            --color-secondary: #666;
            --color-background: #f4f4f9;
            --color-card-bg: #ffffff;
            --shadow-light: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 8px 20px rgba(0, 0, 0, 0.15);
            --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            font-family: var(--font-family-base);
            background-color: var(--color-background);
            color: var(--color-primary);
            line-height: 1.8;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .card-container {
            width: 100%;
            max-width: 600px;
            padding: 30px;
            background-color: var(--color-card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-medium);
            box-sizing: border-box;
        }

        /* ====================================================================
         * 卡片设计 2: 社交媒体风格卡 (Inspired by the second image)
         * 特点: 拟物化、头像、圆角、清晰的列表结构
         * ====================================================================
         */
        .card-social {
            padding: 25px;
            background-color: #ffffff;
            border: 1px solid #e1e8ed;
            border-radius: 18px;
            box-shadow: var(--shadow-light);
        }

        .card-social .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-social .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #bdc3c7; /* 占位符颜色 */
            margin-right: 15px;
            flex-shrink: 0;
            /* 模拟一个简单的头像图标 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #ffffff;
        }

        .card-social .user-info strong {
            display: block;
            font-weight: 600;
            line-height: 1.2;
        }

        .card-social .user-info span {
            color: #777;
            font-size: 14px;
        }

        .card-social .content h3 {
            font-size: 16px;
            font-weight: 500;
            color: #34495e;
            margin: 0 0 15px 0;
        }

        .card-social .content p {
            font-size: 16px;
            margin: 0;
            line-height: 1.6;
        }

    </style>
</head>
<body>

    <!-- 卡片 2: 社交媒体风格卡 -->
    <div class="card-container card-social">
        <div class="header">
            <div class="avatar">A</div>
            <div class="user-info">
                <strong>Andrej Karpathy</strong>
                <span>@karpathy</span>
            </div>
        </div>
        <div class="content">
            <h3>{{title}}</h3>
            <p>
               {{text}}
            </p>
        </div>
    </div>

</body>
</html>
