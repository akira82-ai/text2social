<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Text2Social Preview</title>
  <link rel="stylesheet" href="preview.css">
  <link rel="stylesheet" href="template-selector/selector.css">
</head>
<body>
  <div id="text2social-preview-container" class="preview-container">
    <!-- 标题栏 -->
    <div class="preview-header">
      <h2>标题栏</h2>
    </div>
    
    <!-- 模板选择区域 -->
    <div class="template-selector-container">
      <div id="text2social-template-selector" class="template-selector">
        <div class="template-options">
          <!-- 模板选项将通过JavaScript动态生成 -->
        </div>
      </div>
    </div>
    
    <!-- 预览区域 -->
    <div class="preview-content">
      <div class="preview-placeholder">
        <div class="placeholder-text">预览区域</div>
      </div>
    </div>
    
    <!-- 操作按钮 -->
    <div class="preview-actions">
      <button id="text2social-export-btn" class="export-btn">
        <span class="btn-text">复制为图片</span>
        <div class="spinner"></div>
        <svg class="checkmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle class="checkmark-circle" cx="12" cy="12" r="10"></circle>
          <path class="checkmark-check" d="M8 12l2 2 4-4"></path>
        </svg>
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      </button>
    </div>
    
    <!-- 状态消息 -->
    <div class="status-message"></div>
  </div>

  <script src="../../lib/html2canvas.min.js"></script>
  <script src="../utils/constants.js"></script>
  <script src="template-selector/selector.js"></script>
  <script src="preview.js"></script>
</body>
</html>
