<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Text2Social Preview (Bundle Test)</title>
  <link rel="stylesheet" href="preview.css">
  <link rel="stylesheet" href="../template-selector/selector.css">
</head>
<body>
  <div id="text2social-preview-container" class="preview-container">
    <div class="preview-header">
      <h2>文本卡片</h2>
    </div>

    <div id="text2social-template-selector-container" class="template-selector-container">
      <!-- 模板选择器组件将在这里渲染 -->
    </div>

    <div id="text2social-preview-content" class="preview-content">
      <div class="preview-placeholder">
        <div class="placeholder-text">预览区域</div>
      </div>
    </div>

    <div class="preview-actions">
      <button id="text2social-export-btn" class="export-btn">复制为图片</button>
    </div>
  </div>

  <script src="preview-bundle.js"></script>
</body>
</html>
